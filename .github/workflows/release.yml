name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Build Deadeye
        shell: powershell
        run: |
          .\build.ps1 -Toolchain mingw

      - name: Package Release
        shell: powershell
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          Compress-Archive -Path build\deadeye.exe, README.md, install.ps1 -DestinationPath "build\Deadeye-$tag-windows-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/deadeye.exe
            build/Deadeye-*.zip
          name: Deadeye ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
